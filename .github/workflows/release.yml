name: release

# 发布 meta-store-node(npm)。
#
# 触发:推 v* tag(版本必须与 node/package.json 一致),或手动 dispatch(仅校验)。
# 凭证:
#   - npm:NPM_TOKEN secret(仓库 Settings → Secrets → Actions;只此一处,禁入仓库/文档)
# meta-store 无 py 实现,故不含 PyPI job。
# 形态对齐 store-graphql/.github/workflows/release.yml 的 npm job。
# 发布顺序:依赖已发布的 nodejs-store(^3.3.0),先于 store-gateway 发布。
# 首发前提:双远端(gitee 事实源 + github 镜像)已建、仓库 secrets 已配、tag 由 gitee 打并 sync。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm publish (meta-store-node)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance(OIDC)
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Check tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json version $PKG 不一致" >&2
            exit 1
          fi
      - name: Install & test
        run: npm install --no-fund --no-audit && npm test
      - name: Pack & inspect
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
